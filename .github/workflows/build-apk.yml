name: Build Telegram Parental Control APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      telegram_ref:
        description: "Upstream DrKLO/Telegram branch or tag to clone"
        required: false
        default: "master"
      build_variant:
        description: "Optional Gradle task override (leave blank for automatic detection)"
        required: false
        default: ""

env:
  JAVA_VERSION: "21"

jobs:
  build-android-apk:
    name: Compile Patched Telegram APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space Safely (Preserve Android SDK & Toolcache Root)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/Go || true
          df -h

      - name: Checkout Fork Overlay Repository
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Set up JDK 21 (Required for Gradle 8.13 & Android SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Clone Upstream DrKLO/Telegram with Native Submodules
        run: |
          UPSTREAM_REF="${{ github.event.inputs.telegram_ref || 'master' }}"
          git clone --depth 1 --branch "$UPSTREAM_REF" --recurse-submodules --shallow-submodules \
            https://github.com/DrKLO/Telegram.git telegram-src

      - name: Auto-Detect & Install Required Android SDK 36, Build-Tools & NDK 27
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > telegram-src/local.properties

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"

          # Inspect upstream Dockerfile, gradle.properties, and build.gradle for exact SDK/NDK versions
          echo "--- Upstream gradle.properties & Dockerfile SDK/NDK hints ---"
          grep -E -i "ndk|sdk|cmake|compile" telegram-src/gradle.properties telegram-src/build.gradle telegram-src/Dockerfile 2>/dev/null || true

          DETECTED_NDK=$(grep -oE '[0-9]{2}\.[0-9]+\.[0-9]+' telegram-src/gradle.properties telegram-src/build.gradle telegram-src/TMessagesProj/build.gradle telegram-src/Dockerfile 2>/dev/null | head -n 1 | cut -d: -f2 || true)
          NDK_VER="${DETECTED_NDK:-27.2.12479018}"
          echo "Installing NDK version: $NDK_VER (plus 27.2.12479018)"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" \
            "ndk;${NDK_VER}" \
            "cmake;3.22.1" \
            "cmake;3.18.1"

      - name: Overlay Parental Control Source & Apply Patches
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          DEFAULT_PARENT_PIN: ${{ secrets.DEFAULT_PARENT_PIN }}
          PARENT_PIN: ${{ secrets.PARENT_PIN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cp -r overlay/TMessagesProj/* telegram-src/TMessagesProj/
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p telegram-src/TMessagesProj/config
            echo "$KEYSTORE_BASE64" | base64 -d > telegram-src/TMessagesProj/config/release.keystore
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > telegram-src/TMessagesProj/google-services.json
          fi
          python3 overlay/scripts/apply_parental_patch.py telegram-src

      - name: Build Telegram APK via Gradle
        working-directory: telegram-src
        env:
          CUSTOM_TASK: ${{ github.event.inputs.build_variant }}
        run: |
          chmod +x ./gradlew
          if [ -n "$CUSTOM_TASK" ]; then
            TARGET_TASK="$CUSTOM_TASK"
          elif [ -d "TMessagesProj_AppStandalone" ]; then
            # Modern DrKLO/Telegram splits the library (:TMessagesProj) and standalone app (:TMessagesProj_AppStandalone)
            echo "Listing available assemble tasks in :TMessagesProj_AppStandalone..."
            TASKS_OUT=$(./gradlew :TMessagesProj_AppStandalone:tasks --group=build --no-daemon --console=plain || true)
            echo "$TASKS_OUT" | grep -i "assemble" || true
            if echo "$TASKS_OUT" | grep -q "assembleAfatStandalone"; then
              TARGET_TASK=":TMessagesProj_AppStandalone:assembleAfatStandalone"
            elif echo "$TASKS_OUT" | grep -q "assembleAfatDebug"; then
              TARGET_TASK=":TMessagesProj_AppStandalone:assembleAfatDebug"
            elif echo "$TASKS_OUT" | grep -q "assembleStandalone"; then
              TARGET_TASK=":TMessagesProj_AppStandalone:assembleStandalone"
            else
              TARGET_TASK=":TMessagesProj_AppStandalone:assembleDebug"
            fi
          elif [ -d "TMessagesProj_App" ]; then
            TARGET_TASK=":TMessagesProj_App:assembleAfatDebug"
          else
            TARGET_TASK=":TMessagesProj:assembleAfatDebug"
          fi

          echo "=========================================="
          echo "Running Gradle task: $TARGET_TASK"
          echo "=========================================="
          ./gradlew "$TARGET_TASK" --no-daemon --console=plain

      - name: Collect Compiled APK Files
        run: |
          mkdir -p output-apk
          find telegram-src -path "*/outputs/apk/*.apk" -exec cp {} output-apk/ \;
          ls -lh output-apk/

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-parental-control-apk
          path: output-apk/*.apk
          retention-days: 30
