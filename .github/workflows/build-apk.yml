
name: Build Telegram Parental Control APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      telegram_ref:
        description: "Upstream DrKLO/Telegram branch or tag to clone"
        required: false
        default: "master"
      build_variant:
        description: "Gradle build task (e.g. assembleAfatDebug or assembleAfatRelease)"
        required: false
        default: "assembleAfatDebug"

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "21.4.7075529"
  CMAKE_VERSION: "3.18.1"

jobs:
  build-android-apk:
    name: Compile Patched Telegram APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free Disk Space (Required for Android NDK + Telegram Native Build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Fork Overlay Repository
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Clone Upstream DrKLO/Telegram with Native Submodules
        run: |
          UPSTREAM_REF="${{ github.event.inputs.telegram_ref || 'master' }}"
          git clone --depth 1 --branch "$UPSTREAM_REF" --recurse-submodules --shallow-submodules \
            https://github.com/DrKLO/Telegram.git telegram-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install Required Android NDK & CMake Packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Signing Keystore (Uses Secret or Auto-Generates Fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p telegram-src/TMessagesProj/config
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > telegram-src/TMessagesProj/config/release.keystore
            cp telegram-src/TMessagesProj/config/release.keystore telegram-src/TMessagesProj/config/debug.keystore
          else
            keytool -genkeypair -v \
              -keystore telegram-src/TMessagesProj/config/release.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cp telegram-src/TMessagesProj/config/release.keystore telegram-src/TMessagesProj/config/debug.keystore
          fi

      - name: Overlay Parental Control Source & Apply Patches
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_APP_ID: ${{ secrets.TG_APP_ID }}
          TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
          DEFAULT_PARENT_PIN: ${{ secrets.DEFAULT_PARENT_PIN }}
          PARENT_PIN: ${{ secrets.PARENT_PIN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cp -r overlay/TMessagesProj/* telegram-src/TMessagesProj/
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > telegram-src/TMessagesProj/google-services.json
          fi
          python3 overlay/scripts/apply_parental_patch.py telegram-src

      - name: Build Telegram APK via Gradle
        working-directory: telegram-src
        run: |
          chmod +x ./gradlew
          TASK="${{ github.event.inputs.build_variant || 'assembleAfatDebug' }}"
          ./gradlew ":TMessagesProj:${TASK}" --no-daemon --stacktrace

      - name: Collect Compiled APK Files
        run: |
          mkdir -p output-apk
          find telegram-src/TMessagesProj/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -lh output-apk/

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-parental-control-apk
          path: output-apk/*.apk
          retention-days: 30
