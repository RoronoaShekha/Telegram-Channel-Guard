name: Build Telegram Channel Guard (ARM64 Debug APK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ARM64 Debug APK (Poco M3 Pro)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Maximize Runner Disk Space (Free ~30GB for NDK/TDLib)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout Telegram-Channel-Guard Repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies & Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git git-lfs cmake ninja-build pkg-config python3
          git lfs install

      - name: Set up JDK 25 (Required by Telegram X Gradle Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Clone Upstream TGX-Android/Telegram-X with Submodules & LFS
        run: |
          git config --global core.longpaths true
          git clone --recursive --shallow-submodules --depth=1 https://github.com/TGX-Android/Telegram-X.git tgx-src
          cd tgx-src
          git lfs pull
          if [ -f reproducible-builds/dependencies.txt ]; then
            sudo apt-get install -y $(grep -vE "openjdk|git" reproducible-builds/dependencies.txt | tr '\n' ' ') || true
          fi

      - name: Set up Android SDK, Build-Tools 37, and NDK 30
        run: |
          cd tgx-src
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          if [ -f scripts/setup.sh ]; then
            yes | bash scripts/setup.sh || true
          fi
          CMDLINE_TOOLS="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$CMDLINE_TOOLS" ]; then
            CMDLINE_TOOLS=$(find "$ANDROID_SDK_ROOT" -name sdkmanager | head -n 1)
          fi
          yes | "$CMDLINE_TOOLS" --licenses > /dev/null || true
          "$CMDLINE_TOOLS" "platform-tools" "platforms;android-37" "platforms;android-36" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;3.22.1" || true

      - name: Inject Telegram Channel Guard Source & Enforcement Hooks
        run: |
          mkdir -p tgx-src/app/src/main/java/org/thunderdog/challegram/guard
          cp -v app/src/main/java/org/thunderdog/challegram/guard/ChannelGuardManager.java \
                tgx-src/app/src/main/java/org/thunderdog/challegram/guard/
          cp -v app/src/main/java/org/thunderdog/challegram/guard/ChannelGuardController.java \
                tgx-src/app/src/main/java/org/thunderdog/challegram/guard/
          python3 scripts/apply_channel_guard.py tgx-src
          cp -v NOTICE.md tgx-src/NOTICE.md

      - name: Configure local.properties from GitHub Actions Secrets (Never Committed)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Missing TG_API_ID or TG_API_HASH in GitHub Actions Secrets!"
            exit 1
          fi
          cat <<EOF > tgx-src/local.properties
          sdk.dir=${ANDROID_SDK_ROOT}
          app.id=org.thunderdog.challegram.guard
          app.name=Telegram Channel Guard
          app.download_url=https://github.com/RoronoaShekha/Telegram-Channel-Guard
          telegram.api_id=${TG_API_ID}
          telegram.api_hash=${TG_API_HASH}
          tgx.extension=none
          EOF
          sed -i 's/"org.thunderdog.challegram"/"org.thunderdog.challegram.guard"/g' tgx-src/app/google-services.json

      - name: Configure Gradle Memory Limits for CI Runner
        run: |
          cat <<EOF >> tgx-src/gradle.properties
          org.gradle.jvmargs=-Xmx5120m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.workers.max=2
          EOF

      - name: Validate Git Submodules & Build ARM64 Debug APK
        run: |
          cd tgx-src
          chmod +x gradlew
          ./gradlew :app:validateGitSetup --stacktrace
          ./gradlew :app:assembleLatestDebug -Pabi=arm64 --stacktrace

      - name: Upload Telegram Channel Guard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Channel-Guard-arm64-debug
          path: tgx-src/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
